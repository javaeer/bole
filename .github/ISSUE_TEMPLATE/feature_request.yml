name: 💡 功能建议 / Feature Request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景与问题 / Problem
      description: 这个功能要解决什么问题？当前有什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: 你希望如何实现或解决。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 是否考虑过其他方案？
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional Context
      description: 截图、参考链接等其他信息。
