name: 🐞 Bug 报告 / Bug Report
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供完整信息，以便我们快速定位问题。
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 清晰、简洁地描述问题是什么。
      placeholder: 例如：简历导出为 Word 时，中文字体丢失。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to Reproduce
      description: 如何一步步复现该问题。
      placeholder: |
        1. 进入简历编辑页
        2. 点击「导出 Word」
        3. 打开文件发现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望表现 / Expected Behavior
      description: 你期望发生什么。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际表现 / Actual Behavior
      description: 实际发生了什么（可附截图）。
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境信息 / Environment
      description: 操作系统、JDK / Node 版本、浏览器等。
      placeholder: "macOS 14 / JDK 17 / Node 20 / Chrome 120"
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Logs
      description: 粘贴相关错误日志（请脱敏）。
      render: shell
