<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE">简历系统</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- 项目通用CSS -->
    <link th:href="@{/css/resumes-common.css}" rel="stylesheet">

    <!-- 布局占位：页面特定CSS -->
    <th:block layout:fragment="head-css"></th:block>
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-file-earmark-text"></i> 智能简历系统
        </a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/resumes}">我的简历</a>
            <a class="nav-link" th:href="@{/templates}">选择模板</a>
        </div>
    </div>
</nav>

<!-- 主内容区 -->
<main class="container py-4" style="min-height: calc(100vh - 130px);">
    <div layout:fragment="content">
        <!-- 内容将被插入这里 -->
    </div>
</main>

<!-- 页脚 -->
<footer class="bg-light border-top py-3 mt-auto">
    <div class="container text-center text-muted">
        <small>&copy; 2024 智能简历系统. 所有模板设计仅供参考。</small>
    </div>
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 布局占位：页面特定JS -->
<th:block layout:fragment="footer-js"></th:block>
</body>
</html>
