<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${resumes.name} + ' - 简历预览'">简历预览</title>

    <!-- 页面专属CSS -->
    <style th:inline="text">
        /* ============================================
           CSS变量定义 - 基于全局样式
           ============================================ */
        :root {
            /* 颜色变量 */
            --primary-color: [[${layoutData.globalStyle?.primaryColor ?: '#722ed1'}]];
            --accent-color: [[${layoutData.globalStyle?.accentColor ?: '#9254de'}]];
            --secondary-color: [[${layoutData.globalStyle?.secondaryColor ?: '#531dab'}]];
            --bg-color: [[${layoutData.globalStyle?.backgroundColor ?: '#f9f0ff'}]];
            --header-color: [[${layoutData.globalStyle?.headerColor ?: '#722ed1'}]];
            --text-color: #333333;

            /* 字体变量 */
            --font-family: [[${layoutData.globalStyle?.fontFamily ?: "'Playfair Display', 'Georgia', serif"}]];
            --font-size-h1: [[${layoutData.globalStyle?.fontSizes?.h1 ?: '32'}]]px;
            --font-size-body: [[${layoutData.globalStyle?.fontSizes?.body ?: '13'}]]px;

            /* 间距变量 */
            --section-margin: [[${layoutData.globalStyle?.spacing?.sectionMargin ?: '16px'}]];
            --spacing-padding: [[${layoutData.globalStyle?.spacing?.padding ?: '20px'}]];
            --line-height: [[${layoutData.globalStyle?.spacing?.lineHeight ?: '1.6'}]];

            /* 布局变量 */
            --max-width-single: 800px;
            --max-width-two-column: 1200px;
            --max-width-timeline: 900px;
            --max-width-card: 1200px;
            --max-width-mixed: 1000px;
        }

        /* ============================================
           全局基础样式
           ============================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            font-size: var(--font-size-body);
            line-height: var(--line-height);
            color: var(--text-color);
            background-color: #f5f5f5;
            padding: 20px;
        }

        /* ============================================
           简历容器样式
           ============================================ */
        .resume-container {
            width: 100%;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            background-color: var(--bg-color);
            font-family: var(--font-family);
            font-size: var(--font-size-body);
            line-height: var(--line-height);
            box-sizing: border-box;
            min-height: 297mm;
            page-break-inside: avoid;
            break-inside: avoid;
            padding: var(--spacing-padding);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        /* ============================================
           布局样式
           ============================================ */

        /* 单列布局 */
        .single-layout {
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: var(--section-margin);
            margin: 0 auto;
        }

        /* 双列布局 */
        .two-column-layout {
            display: flex;
            gap: 20px;
            width: 90%;
            max-width: var(--max-width-two-column);
            margin: 0 auto;
        }

        .two-column-layout .left-column,
        .two-column-layout .right-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--section-margin);
        }

        /* 三列布局 */
        .three-column-layout {
            display: flex;
            gap: 20px;
            width: 90%;
            max-width: var(--max-width-two-column);
            margin: 0 auto;
        }

        .three-column-layout .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--section-margin);
        }

        /* 时间线布局 */
        .timeline-layout {
            position: relative;
            width: 90%;
            max-width: var(--max-width-timeline);
            margin: 0 auto;
            padding: 20px 0;
        }

        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            background-color: var(--secondary-color);
            opacity: 0.6;
            transform: translateX(-50%);
            z-index: 1;
        }

        .timeline-node {
            position: absolute;
            left: 50%;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--primary-color);
            border: 3px solid var(--bg-color);
            transform: translate(-50%, -50%);
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        /* 卡片布局 */
        .card-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: var(--max-width-card);
            margin: 0 auto;
        }

        /* 混合布局 */
        .mixed-layout {
            width: 90%;
            max-width: var(--max-width-mixed);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--section-margin);
        }

        .mixed-bottom {
            display: flex;
            gap: 20px;
            width: 100%;
            margin-top: 30px;
        }

        /* ============================================
           组件基础样式
           ============================================ */
        .resume-component {
            transition: all 0.3s ease;
            page-break-inside: avoid;
            break-inside: avoid;
            width: 100%;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            border-left: 3px solid var(--primary-color);
        }

        .component-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--secondary-color);
        }

        .component-title {
            flex: 1;
            font-size: var(--font-size-h1);
            color: var(--header-color);
            font-weight: bold;
            line-height: 1.2;
        }

        .component-content {
            min-height: 20px;
        }

        /* ============================================
           具体组件样式
           ============================================ */

        /* 基本信息组件 */
        .user-basic-info {
            width: 100%;
        }

        .basic-section {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 16px;
        }

        .avatar-section {
            flex-shrink: 0;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #e8e8e8;
            object-fit: cover;
        }

        .avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #999;
            border: 2px solid #e8e8e8;
        }

        .info-section {
            flex: 1;
            min-width: 0;
        }

        .name-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-color);
            margin-right: 12px;
        }

        .title-tag {
            color: var(--primary-color);
            font-size: 12px;
            background-color: rgba(114, 46, 209, 0.1);
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 500;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon {
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        .contact-text {
            color: #666;
            font-size: 14px;
            word-break: break-word;
        }

        .other-info-section {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            padding-top: 16px;
            border-top: 1px dashed var(--secondary-color);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }

        .label {
            color: #999;
            font-size: 13px;
            flex-shrink: 0;
        }

        .value {
            color: #666;
            font-size: 13px;
            word-break: break-word;
        }

        /* 技能组件 */
        .skills-component {
            width: 100%;
        }

        .category-header {
            margin-bottom: 16px;
        }

        .category-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin-right: 8px;
            display: inline-block;
        }

        .category-count {
            font-size: 14px;
            color: #666;
            opacity: 0.8;
            display: inline-block;
        }

        .skills-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .skill-item {
            padding: 16px;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 3px solid var(--primary-color);
        }

        .skill-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .skill-level-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f6f6f6;
            border-radius: 16px;
            padding: 4px 12px;
            border: 1px solid #e8e8e8;
        }

        .level-text {
            font-size: 13px;
            font-weight: 500;
            color: #666;
        }

        .skill-description {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 12px;
            padding: 8px;
            background: #fafafa;
            border-radius: 6px;
            border-left: 3px solid #e8e8e8;
        }

        .skill-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .tag-item {
            background-color: #e6f7ff;
            border: 1px solid rgba(24, 144, 255, 0.2);
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 11px;
            color: #333;
        }

        .skill-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--secondary-color);
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: #f5f5f5;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            background-color: var(--primary-color);
        }

        /* 自我评价组件 */
        .self-evaluation-container {
            width: 100%;
        }

        .evaluation-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--secondary-color);
        }

        .evaluation-content {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            text-align: justify;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 16px;
        }

        .highlights-section {
            margin-top: 16px;
        }

        .highlights-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .highlight-tag {
            font-size: 12px;
            color: var(--accent-color);
            background-color: rgba(146, 84, 222, 0.1);
            padding: 4px 12px;
            border-radius: 16px;
            border: 1px solid rgba(146, 84, 222, 0.3);
        }

        /* 工作经历组件 */
        .work-experience-container {
            position: relative;
            width: 100%;
        }

        .experience-item {
            position: relative;
            padding-left: 40px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--secondary-color);
        }

        .company-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .company-name {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 4px;
            display: block;
        }

        .position {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-color);
            display: block;
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
        }

        .time-period {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .time-text {
            font-size: 12px;
            color: #999;
            background-color: #f5f5f5;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .description {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin: 8px 0;
            text-align: justify;
        }

        .achievements-list {
            padding-left: 16px;
            margin-top: 8px;
        }

        .achievement-item {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 4px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        /* 教育背景组件 */
        .education-experience-container {
            width: 100%;
        }

        .education-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .education-item {
            position: relative;
            display: flex;
            gap: 16px;
        }

        .item-decoration {
            flex-shrink: 0;
            width: 4px;
            border-radius: 2px;
            background-color: var(--primary-color);
        }

        .item-content {
            flex: 1;
            min-width: 0;
        }

        .school-name {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .degree-major {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .major {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .degree {
            font-size: 13px;
            color: var(--accent-color);
        }

        .time-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        /* 项目经历组件 */
        .project-experience-container {
            width: 100%;
        }

        .project-item {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 24px;
            width: 94%;
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .project-name {
            font-size: 17px;
            font-weight: bold;
            color: var(--header-color);
            line-height: 1.3;
            margin-bottom: 6px;
            display: block;
        }

        .project-description {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--secondary-color);
        }

        .responsibilities-list,
        .achievements-list {
            padding-left: 16px;
            margin-top: 8px;
        }

        .responsibility-item,
        .achievement-item {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 4px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        /* 求职意向组件 */
        .job-intention-container {
            width: 100%;
        }

        .intention-item {
            padding: 16px;
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid var(--secondary-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .position-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
            gap: 8px;
        }

        .position-value {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--primary-color);
            font-size: 18px;
            font-weight: bold;
            margin-left: 8px;
        }

        .intention-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .tag-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }

        /* 空状态样式 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 16px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .empty-description {
            font-size: 14px;
            color: #ccc;
        }

        /* ============================================
           响应式设计
           ============================================ */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .resume-container {
                padding: 16px !important;
                min-height: auto !important;
                border-radius: 4px;
            }

            /* 单列布局在移动端 */
            .single-layout {
                gap: 12px !important;
            }

            /* 双列布局在移动端改为单列 */
            .two-column-layout {
                flex-direction: column !important;
                gap: 12px !important;
                max-width: 100% !important;
                margin: 0 !important;
            }

            .two-column-layout .left-column,
            .two-column-layout .right-column {
                width: 100% !important;
                flex: none !important;
            }

            /* 三列布局在移动端改为单列 */
            .three-column-layout {
                flex-direction: column !important;
                gap: 12px !important;
                max-width: 100% !important;
                margin: 0 !important;
            }

            .three-column-layout .column {
                width: 100% !important;
            }

            /* 混合布局在移动端改为单列 */
            .mixed-layout {
                max-width: 100% !important;
                margin: 0 !important;
                gap: 12px !important;
            }

            .mixed-bottom {
                flex-direction: column !important;
                gap: 12px !important;
                margin-top: 20px !important;
            }

            /* 卡片布局在移动端改为单列 */
            .card-layout {
                grid-template-columns: 1fr !important;
                gap: 12px !important;
                max-width: 100% !important;
                margin: 0 !important;
            }

            /* 时间线布局在移动端改为居中单列 */
            .timeline-layout {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .timeline-line {
                display: none;
            }

            .timeline-node {
                display: none;
            }

            /* 组件项在移动端取消最大宽度限制 */
            .resume-component {
                margin-bottom: 12px !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
                max-width: 100% !important;
            }

            .component-title {
                font-size: 18px !important;
            }

            /* 基本信息响应式 */
            .basic-section {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 16px;
            }

            .avatar,
            .avatar-placeholder {
                width: 60px !important;
                height: 60px !important;
            }

            .name {
                font-size: 18px !important;
            }

            .contact-item {
                justify-content: center;
            }

            .other-info-section {
                justify-content: center;
                text-align: center;
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .resume-container {
                padding: 12px !important;
            }

            .single-layout,
            .timeline-layout,
            .card-layout,
            .mixed-layout {
                gap: 8px !important;
            }

            .component-title {
                font-size: 16px !important;
            }

            .resume-component {
                padding: 12px !important;
                margin-bottom: 8px !important;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .resume-container {
                padding: 20px !important;
            }

            .card-layout {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 16px !important;
            }
        }

        /* ============================================
           打印样式
           ============================================ */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .resume-container {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                max-width: 100% !important;
                background-color: white !important;
                min-height: auto !important;
            }

            .resume-component {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                margin-bottom: 12px !important;
                padding: 12px !important;
                background-color: white !important;
            }

            .component-title {
                color: #000 !important;
            }

            /* 确保打印时内容居中 */
            .basic-section,
            .other-info-section {
                justify-content: flex-start !important;
            }
        }
    </style>
</head>
<body>
<div th:fragment="content">
    <!-- 简历预览主容器 -->
    <div class="resume-container" th:classappend="${device}">

        <!-- 布局渲染区域 -->
        <div th:switch="${layoutData.layoutType}">

            <!-- 双列布局 -->
            <div th:case="'two-column'">
                <div th:replace="~{resumes/fragments/layout-two ::
                        layout-two(${layoutData}, ${globalStyle})}">
                </div>
            </div>

            <!-- 三列布局 -->
            <div th:case="'three-column'">
                <div th:replace="~{resumes/fragments/layout-three ::
                        layout-three(${layoutData}, ${globalStyle})}">
                </div>
            </div>

            <!-- 时间线布局 -->
            <div th:case="'timeline'">
                <div th:replace="~{resumes/fragments/layout-timeline ::
                        layout-timeline(${layoutData}, ${globalStyle})}">
                </div>
            </div>

            <!-- 卡片布局 -->
            <div th:case="'card'">
                <div th:replace="~{resumes/fragments/layout-card ::
                        layout-card(${layoutData}, ${globalStyle})}">
                </div>
            </div>

            <!-- 混合布局 -->
            <div th:case="'mixed'">
                <div th:replace="~{resumes/fragments/layout-mixed ::
                        layout-mixed(${layoutData}, ${globalStyle})}">
                </div>
            </div>

            <!-- 默认单列布局 -->
            <div th:case="*">
                <div th:replace="~{resumes/fragments/layout-single ::
                        layout-single(${layoutData}, ${globalStyle})}">
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript交互 -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            // 组件悬停效果
            document.querySelectorAll('.resume-component').forEach(function(component) {
                component.addEventListener('mouseenter', function() {
                    this.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
                    this.style.transform = 'translateY(-2px)';
                });
                component.addEventListener('mouseleave', function() {
                    this.style.boxShadow = '';
                    this.style.transform = '';
                });
            });

            // 打印样式调整
            window.addEventListener('beforeprint', function() {
                document.querySelector('.resume-container').classList.add('print-mode');
            });

            window.addEventListener('afterprint', function() {
                document.querySelector('.resume-container').classList.remove('print-mode');
            });
        });
        /*]]>*/
    </script>
</div>
</body>
</html>
