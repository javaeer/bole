<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 时间线布局 -->
<div th:fragment="layout-timeline(layoutData, globalStyle)"
     class="timeline-layout"
     th:style="${layoutData.layoutStyle != null ? layoutData.layoutStyle : ''}">

    <div class="timeline-line" th:style="${layoutData.timelineLineStyle}"></div>

    <th:block th:each="component,iter : ${layoutData.allComponents}">

        <div class="timeline-item" th:style="${layoutData.getTimelineItemStyle(iter.index)}">
            <div class="timeline-node" th:style="${layoutData.timelineNodeStyle}"></div>
            <div class="timeline-content" th:style="${layoutData.getTimelineContentStyle(component)}">
                <div th:replace="~{resumes/fragments/component-renderer ::
                                          component-renderer(${component}, ${globalStyle})}">
                </div>
            </div>
        </div>
    </th:block>

    <!-- 空状态 -->
    <div th:if="${layoutData.isEmpty}" class="empty-state">
        <div class="empty-icon">📄</div>
        <div class="empty-title">暂无内容</div>
    </div>
</div>
</body>
</html>
