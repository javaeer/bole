<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        /* 组件基础样式 */
        .component-preview {
            margin-bottom: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 16px;
            background: white;
            transition: all 0.3s;
            position: relative;
        }

        .component-preview:hover {
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .component-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            padding-left: 8px;
        }

        .component-title {
            font-size: 18px;
            font-weight: bold;
        }

        .component-actions {
            display: flex;
            gap: 4px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            line-height: 1;
        }

        .btn-icon:hover {
            background: #f5f5f5;
        }

        .component-content {
            min-height: 30px;
        }

        /* 预览内容样式 */
        .preview-placeholder {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .preview-avatar {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .avatar-placeholder {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .preview-section {
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #eee;
        }

        .preview-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .preview-line {
            margin-bottom: 6px;
            color: #555;
        }

        .preview-line-bold {
            margin-bottom: 4px;
            font-weight: bold;
            color: #333;
        }

        .preview-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tag {
            padding: 3px 9px;
            background: #e8f4ff;
            border-radius: 3px;
            font-size: 13px;
            color: #007aff;
        }

        .preview-tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
        }

        .tech-tag {
            padding: 2px 6px;
            background: #e9ecef;
            border-radius: 2px;
            font-size: 12px;
            color: #495057;
        }

        .skill-levels {
            margin-top: 12px;
        }

        .skill-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .skill-item:last-child {
            margin-bottom: 0;
        }

        .skill-name {
            width: 100px;
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }

        .skill-level-bar {
            flex: 1;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-left: 8px;
        }

        .skill-level-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .skill-level-text {
            width: 50px;
            text-align: right;
            font-size: 12px;
            color: #666;
            margin-left: 8px;
        }

        .placeholder-text {
            color: #999;
            font-style: italic;
            text-align: center;
            display: block;
            padding: 15px;
        }

        /* 工作经历和教育背景样式 */
        .experience-item {
            margin-bottom: 16px;
            padding-left: 16px;
            border-left: 2px solid #e8e8e8;
        }

        .experience-item:last-child {
            margin-bottom: 0;
        }

        .experience-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .experience-title {
            font-weight: bold;
            color: #333;
            font-size: 15px;
        }

        .experience-period {
            font-size: 12px;
            color: #999;
        }

        .experience-details {
            font-size: 13px;
            color: #555;
            margin-top: 4px;
        }

        .experience-achievements {
            margin-top: 8px;
            padding-left: 16px;
        }

        .achievement-item {
            font-size: 12px;
            color: #666;
            margin-bottom: 2px;
        }

        /* 自我评价样式 */
        .self-evaluation-content {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
        }

        .highlight-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .highlight-tag {
            padding: 2px 6px;
            background: #fff7e6;
            border-radius: 3px;
            font-size: 11px;
            color: #fa8c16;
            border: 1px solid #ffd591;
        }

        /* 求职意向样式 */
        .job-intention-item {
            padding: 12px;
            border: 1px solid #f0f0f0;
            border-radius: 6px;
            margin-bottom: 8px;
            background: #fafafa;
        }

        .intention-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .intention-label {
            width: 70px;
            font-weight: 500;
            color: #333;
            font-size: 13px;
        }

        .intention-value {
            flex: 1;
            font-size: 13px;
            color: #555;
        }

        /* 项目经历样式 */
        .project-item {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #eee;
        }

        .project-item:last-child {
            margin-bottom: 0;
            border-bottom: none;
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .project-name {
            font-weight: bold;
            color: #333;
            font-size: 15px;
        }

        .project-period {
            font-size: 12px;
            color: #999;
        }

        .project-description {
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }

        .project-achievements {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
<!-- 通用组件渲染器 -->
<!-- 修复：添加th:with用于处理条件判断 -->
<div th:fragment="component-renderer(component, globalStyle)" th:object="${component}"
     class="component-preview" th:id="'component-' + *{componentId}"
     th:style="${component.styles} ? ${component.styles} : ''">

    <!-- 组件头部 -->
    <div class="component-header"
         th:style="${component.headerStyle} ? ${component.headerStyle} : ''">

        <!-- 组件标题 -->
        <span class="component-title"
              th:style="${component.titleStyle} ? ${component.titleStyle} : ''"
              th:text="${component.name} ?: '未命名区块'">
            未命名区块
        </span>

    </div>

    <!-- 组件内容区域 -->
    <div class="component-content"
         th:style="${component.contentStyle} ? ${component.contentStyle} : ''">

        <!-- 根据组件key动态渲染不同内容 -->
        <!-- 修复：移除多余的th:block，直接使用div -->
        <div th:switch="${component.key}">

            <!-- 1. 用户基本信息组件 -->
            <div th:case="'UserBasicInfo'">
                <div class="preview-placeholder">
                    <!-- 修复：优化条件判断语法 -->
                    <th:block th:if="${component.props.showAvatar}">
                        <div class="preview-avatar">
                            <th:block th:if="${component.props.avatar != null and component.props.avatar != ''}">
                                <img th:src="${component.props.avatar}"
                                     style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid #e8e8e8; object-fit: cover;"
                                     alt="头像">
                            </th:block>
                            <th:block th:unless="${component.props.avatar != null and component.props.avatar != ''}">
                                <div class="avatar-placeholder">👤</div>
                            </th:block>
                        </div>
                    </th:block>
                    <div class="preview-info">
                        <div class="preview-line" style="font-size: 20px; font-weight: bold; color: #333; margin-bottom: 8px;">
                            <span th:text="${component.props.name} ?: '未填写'"></span>
                        </div>
                        <div class="preview-line" style="color: #666; margin-bottom: 4px;">
                            <span th:text="${component.props.title} ?: '未填写职位'"></span>
                        </div>

                        <th:block th:if="${component.props.showContact}">
                            <div class="preview-line" th:if="${component.props.email != null}">
                                邮箱：<span th:text="${component.props.email}"></span>
                            </div>
                            <div class="preview-line" th:if="${component.props.phone != null}">
                                电话：<span th:text="${component.props.phone}"></span>
                            </div>
                        </th:block>

                        <div class="preview-line" th:if="${component.props.location != null}">
                            地址：<span th:text="${component.props.location}"></span>
                        </div>
                        <div class="preview-line" th:if="${component.props.workYears != null}">
                            工作经验：<span th:text="${component.props.workYears}"></span>年
                        </div>
                        <div class="preview-line" th:if="${component.props.website != null}">
                            个人网站：<a th:href="${component.props.website}" th:text="${component.props.website}" target="_blank" style="color: #1890ff;"></a>
                        </div>
                        <div class="preview-line" th:if="${component.props.github != null}">
                            GitHub：<span th:text="${component.props.github}"></span>
                        </div>
                        <div class="preview-line" th:if="${component.props.wechat != null}">
                            微信：<span th:text="${component.props.wechat}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. 工作经历组件 -->
            <div th:case="'WorkExperience'">
                <div class="preview-placeholder">
                    <!-- 修复：使用更简洁的集合判断语法 -->
                    <th:block th:if="${component.props.experiences != null and not #lists.isEmpty(component.props.experiences)}">
                        <div th:each="exp : ${component.props.experiences}">
                            <div class="experience-item">
                                <div class="experience-header">
                                    <div class="experience-title">
                                        <span th:text="${exp.company}"></span> | <span th:text="${exp.position}"></span>
                                    </div>
                                    <div class="experience-period">
                                        <span th:text="${exp.startDate != null} ? ${exp.startDate} : ''"></span>
                                        <span th:text="${exp.isCurrent != null and exp.isCurrent} ? ' - 至今' : (exp.endDate != null ? (' - ' + ${exp.endDate}) : '')"></span>
                                    </div>
                                </div>
                                <div class="experience-details" th:text="${exp.description}"></div>
                                <th:block th:if="${exp.achievements != null and not #lists.isEmpty(exp.achievements)}">
                                    <div class="experience-achievements">
                                        <div class="achievement-item" th:each="achievement : ${exp.achievements}" th:text="'• ' + ${achievement}"></div>
                                    </div>
                                </th:block>
                            </div>
                        </div>
                    </th:block>
                    <th:block th:unless="${component.props.experiences != null and not #lists.isEmpty(component.props.experiences)}">
                        <span class="placeholder-text">暂无工作经历</span>
                    </th:block>
                </div>
            </div>

            <!-- 3. 教育经历组件 -->
            <div th:case="'EducationExperience'">
                <div class="preview-placeholder">
                    <th:block th:if="${component.props.experiences != null and not #lists.isEmpty(component.props.experiences)}">
                        <div th:each="edu : ${component.props.experiences}">
                            <div class="experience-item">
                                <div class="experience-header">
                                    <div class="experience-title">
                                        <span th:text="${edu.university}"></span> | <span th:text="${edu.major}"></span>
                                    </div>
                                    <div class="experience-period">
                                        <span th:text="${edu.startDate != null} ? ${edu.startDate} : ''"></span>
                                        <span th:text="' - ' + ${edu.endDate != null ? edu.endDate : ''}"></span>
                                    </div>
                                </div>
                                <div class="experience-details">
                                    <span th:text="${edu.degree}"></span>
                                    <th:block th:if="${edu.isHighest != null and edu.isHighest == 1}">
                                        <span style="margin-left: 8px; color: #52c41a; font-size: 12px;">(最高学历)</span>
                                    </th:block>
                                </div>
                                <div class="experience-details" th:text="${edu.description}"></div>
                                <th:block th:if="${edu.achievements != null and not #lists.isEmpty(edu.achievements)}">
                                    <div class="experience-achievements">
                                        <div class="achievement-item" th:each="achievement : ${edu.achievements}" th:text="'• ' + ${achievement}"></div>
                                    </div>
                                </th:block>
                            </div>
                        </div>
                    </th:block>
                    <th:block th:unless="${component.props.experiences != null and not #lists.isEmpty(component.props.experiences)}">
                        <span class="placeholder-text">暂无教育经历</span>
                    </th:block>
                </div>
            </div>

            <!-- 4. 技能组件 -->
            <div th:case="'Skills'">
                <div class="preview-placeholder">
                    <th:block th:if="${component.props.skills != null and not #lists.isEmpty(component.props.skills)}">
                        <div th:each="skill : ${component.props.skills}">
                            <div class="preview-section">
                                <div class="preview-line-bold" th:text="${skill.category}"></div>
                                <div class="skill-item">
                                    <div class="skill-name" th:text="${skill.name}"></div>
                                    <div class="skill-level-bar">
                                        <div class="skill-level-fill"
                                             th:style="'width:' + ${skill.proficiencyPercent != null ? skill.proficiencyPercent : 0} + '%; background-color: #1890ff;'">
                                        </div>
                                    </div>
                                    <div class="skill-level-text">
                                        <span th:text="${skill.level}"></span>
                                        <span th:if="${skill.experienceYears != null}">（<span th:text="${skill.experienceYears}"></span>年）</span>
                                    </div>
                                </div>
                                <th:block th:if="${skill.description != null}">
                                    <div style="font-size: 12px; color: #888; margin: 2px 0 8px 100px;">
                                        <span th:text="${skill.description}"></span>
                                        <th:block th:if="${skill.isCertified != null and skill.isCertified}">
                                            <span style="color: #52c41a; margin-left: 8px;">
                                                <i>✓</i> <span th:text="${skill.certificateName}"></span>
                                                (<span th:text="${skill.certificateDate != null ? skill.certificateDate : ''}"></span>)
                                            </span>
                                        </th:block>
                                    </div>
                                </th:block>
                                <th:block th:if="${component.props.showTags and skill.tags != null and not #lists.isEmpty(skill.tags)}">
                                    <div class="preview-tags" style="margin-left: 100px;">
                                        <th:block th:each="tag : ${skill.tags}">
                                            <span class="tag" th:text="${tag}"></span>
                                        </th:block>
                                    </div>
                                </th:block>
                            </div>
                        </div>
                    </th:block>
                    <th:block th:unless="${component.props.skills != null and not #lists.isEmpty(component.props.skills)}">
                        <span class="placeholder-text">暂无技能信息</span>
                    </th:block>
                </div>
            </div>

            <!-- 5. 项目经历组件 -->
            <div th:case="'ProjectExperience'">
                <div class="preview-placeholder">
                    <th:block th:if="${component.props.experiences != null and not #lists.isEmpty(component.props.experiences)}">
                        <div th:each="project : ${component.props.experiences}">
                            <div class="project-item">
                                <div class="project-header">
                                    <div class="project-name" th:text="${project.name}"></div>
                                    <div class="project-period">
                                        <span th:text="${project.startDate != null ? project.startDate : ''}"></span>
                                        <span th:text="' - ' + ${project.endDate != null ? project.endDate: ''}"></span>
                                    </div>
                                </div>
                                <div class="project-description" th:text="${project.description}"></div>
                                <th:block th:if="${project.achievements != null and not #lists.isEmpty(project.achievements)}">
                                    <div class="project-achievements">
                                        成果：
                                        <!-- 修复：简化迭代语法 -->
                                        <span th:each="achievement, iterStat : ${project.achievements}">
                                            <span th:text="${achievement}"></span>
                                            <span th:if="${!iterStat.last}">；</span>
                                        </span>
                                    </div>
                                </th:block>
                            </div>
                        </div>
                    </th:block>
                    <th:block th:unless="${component.props.experiences != null and not #lists.isEmpty(component.props.experiences)}">
                        <span class="placeholder-text">暂无项目经历</span>
                    </th:block>
                </div>
            </div>

            <!-- 6. 自我评价组件 -->
            <div th:case="'SelfEvaluation'">
                <div class="preview-placeholder">
                    <th:block th:if="${component.props.evaluations != null and not #lists.isEmpty(component.props.evaluations)}">
                        <div th:each="eval : ${component.props.evaluations}">
                            <div class="self-evaluation-content">
                                <div th:text="${eval.content}"></div>
                                <th:block th:if="${eval.highlights != null and not #lists.isEmpty(eval.highlights)}">
                                    <div class="highlight-tags">
                                        <th:block th:each="highlight : ${eval.highlights}">
                                            <span class="highlight-tag" th:text="${highlight}"></span>
                                        </th:block>
                                    </div>
                                </th:block>
                            </div>
                        </div>
                    </th:block>
                    <th:block th:unless="${component.props.evaluations != null and not #lists.isEmpty(component.props.evaluations)}">
                        <span class="placeholder-text">暂无自我评价</span>
                    </th:block>
                </div>
            </div>

            <!-- 7. 求职意向组件 -->
            <div th:case="'JobIntention'">
                <div class="preview-placeholder">
                    <th:block th:if="${component.props.intentions != null and not #lists.isEmpty(component.props.intentions)}">
                        <div th:each="intention : ${component.props.intentions}">
                            <div class="job-intention-item">
                                <div class="intention-row">
                                    <div class="intention-label">职位</div>
                                    <div class="intention-value" th:text="${intention.position}"></div>
                                </div>
                                <th:block th:if="${component.props.showSalary and intention.salary != null}">
                                    <div class="intention-row">
                                        <div class="intention-label">期望薪资</div>
                                        <div class="intention-value" th:text="${intention.salary}"></div>
                                    </div>
                                </th:block>
                                <th:block th:if="${component.props.showLocation and intention.city != null}">
                                    <div class="intention-row">
                                        <div class="intention-label">工作地点</div>
                                        <div class="intention-value" th:text="${intention.city}"></div>
                                    </div>
                                </th:block>
                                <div class="intention-row">
                                    <div class="intention-label">工作类型</div>
                                    <div class="intention-value" th:text="${intention.jobType}"></div>
                                </div>
                            </div>
                        </div>
                    </th:block>
                    <th:block th:unless="${component.props.intentions != null and not #lists.isEmpty(component.props.intentions)}">
                        <span class="placeholder-text">暂无求职意向</span>
                    </th:block>
                </div>
            </div>

            <!-- 8. 其他组件类型（通用） -->
            <div th:case="*">
                <div class="preview-placeholder">
                    <th:block th:if="${component.key != null}">
                        <span class="placeholder-text"
                              th:text="'【' + ${component.name} + '】 组件预览'">
                            【未命名】组件预览
                        </span>
                    </th:block>
                    <th:block th:unless="${component.key != null}">
                        <span class="placeholder-text">未知组件类型</span>
                    </th:block>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript交互 -->
<script th:inline="javascript">
    /*<![CDATA[*/
    // 组件操作函数
    function configureComponent(componentId) {
        console.log('配置组件:', componentId);
        // 这里可以打开配置模态框
        // showComponentConfigModal(componentId);
        alert('配置组件: ' + componentId);
    }

    function removeComponent(componentId) {
        console.log('删除组件:', componentId);
        if (confirm('确定要删除这个组件吗？')) {
            // 这里可以发送AJAX请求删除组件
            // fetch('/resumes/remove-component/' + componentId, { method: 'DELETE' })
            //     .then(response => location.reload());
            alert('删除组件: ' + componentId + ' (模拟)');
        }
    }

    // 组件悬停效果
    document.addEventListener('DOMContentLoaded', function () {
        const components = document.querySelectorAll('.component-preview');
        components.forEach(function (component) {
            component.addEventListener('mouseenter', function () {
                this.style.boxShadow = '0 4px 16px rgba(0, 0, 0, 0.12)';
            });

            component.addEventListener('mouseleave', function () {
                this.style.boxShadow = '';
            });
        });
    });

    // 日期格式化辅助函数
    function formatDate(dateStr) {
        if (!dateStr) return '';
        try {
            const date = new Date(dateStr);
            return date.getFullYear() + '.' + (date.getMonth() + 1).toString().padStart(2, '0');
        } catch (e) {
            return dateStr;
        }
    }

    // 应用日期格式化
    document.addEventListener('DOMContentLoaded', function() {
        // 自动格式化日期显示
        document.querySelectorAll('.experience-period, .project-period').forEach(function(el) {
            const text = el.textContent;
            if (text.includes('-')) {
                const parts = text.split(' - ');
                if (parts.length === 2) {
                    el.textContent = formatDate(parts[0]) + ' - ' + (parts[1] === '至今' ? '至今' : formatDate(parts[1]));
                }
            }
        });
    });
    /*]]>*/
</script>
</body>
</html>
