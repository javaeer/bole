<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 混合布局 -->
<div th:fragment="layout-mixed(layoutData, globalStyle)"
     class="mixed-layout"
     th:style="${layoutData.layoutStyle != null ? layoutData.layoutStyle : ''}">

    <div class="mixed-top">


        <!-- 组件头部 -->
        <div class="component-header" th:if="${component.name != null}"
             th:style="${component.headerStyle}">
                    <span class="component-title"
                          th:style="${component.titleStyle}"
                          th:text="${component.name}">
                        未命名组件
                    </span>
        </div>

        <!-- 组件内容 -->
        <th:block th:each="component : ${layoutData.topComponents}">
            <div th:replace="~{resumes/fragments/component-renderer ::
                                      component-renderer(${component}, ${globalStyle})}">
            </div>
        </th:block>
    </div>
    <div class="mixed-bottom" th:style="${layoutData.mixedBottomStyle}">
        <div class="left-column" th:style="${layoutData.leftColumnStyle}">
            <!-- 组件头部 -->
            <div class="component-header" th:if="${component.name != null}"
                 th:style="${component.headerStyle}">
                    <span class="component-title"
                          th:style="${component.titleStyle}"
                          th:text="${component.name}">
                        未命名组件
                    </span>
            </div>

            <!-- 组件内容 -->
            <th:block th:each="component : ${layoutData.bottomLeftComponents}">
                <div th:replace="~{resumes/fragments/component-renderer ::
                                          component-renderer(${component}, ${globalStyle})}">
                </div>
            </th:block>
        </div>
        <div class="right-column" th:style="${layoutData.rightColumnStyle}">
            <!-- 组件头部 -->
            <div class="component-header" th:if="${component.name != null}"
                 th:style="${component.headerStyle}">
                    <span class="component-title"
                          th:style="${component.titleStyle}"
                          th:text="${component.name}">
                        未命名组件
                    </span>
            </div>

            <!-- 组件内容 -->
            <th:block th:each="component : ${layoutData.bottomRightComponents}">
                <div th:replace="~{resumes/fragments/component-renderer ::
                                          component-renderer(${component}, ${globalStyle})}">
                </div>
            </th:block>
        </div>
    </div>

    <!-- 空状态 -->
    <div th:if="${layoutData.isEmpty}" class="empty-state">
        <div class="empty-icon">📄</div>
        <div class="empty-title">暂无内容</div>
    </div>

</div>
</body>
</html>
