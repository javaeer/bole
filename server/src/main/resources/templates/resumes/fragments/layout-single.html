<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 单栏布局 -->
<div th:fragment="layout-single(layoutData, globalStyle)"
     class="layout-single-column">

  <th:block th:if="${layoutData.allComponents != null and not #lists.isEmpty(layoutData.allComponents)}">
    <th:block th:each="component,iter : ${layoutData.allComponents}" th:object="${component}">
      <div class="resume-component" th:classappend="${iter.last} ? 'last-component' : ''"
           th:attr="data-component-id=*{componentId}, data-component-key=*{key}">
        <!-- 组件渲染器（可复用单栏的组件逻辑） -->
        <th:block th:replace="~{resumes/fragments/component-renderer ::
                            component-renderer(${component}, ${globalStyle})}">
        </th:block>
      </div>
    </th:block>
  </th:block>

  <!-- 空状态 -->
  <th:block th:unless="${layoutData.allComponents != null and not #lists.isEmpty(layoutData.allComponents)}">
    <div class="empty-state">
      <div class="empty-icon">📄</div>
      <div class="empty-title">暂无内容</div>
      <div class="empty-desc">请添加区块以预览模板效果</div>
    </div>
  </th:block>
</div>
</body>
</html>
