<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 卡片布局 -->
<div th:fragment="layout-card(layoutData, globalStyle)"
     class="card-layout"
     th:style="${layoutData.layoutStyle != null ? layoutData.layoutStyle : ''}">

    <!-- 组件头部 -->
    <div class="component-header" th:if="${component.name != null}"
         th:style="${component.headerStyle}">
                    <span class="component-title"
                          th:style="${component.titleStyle}"
                          th:text="${component.name}">
                        未命名组件
                    </span>
    </div>

    <!-- 组件内容 -->
    <th:block th:each="component : ${layoutData.allComponents}">
        <div class="card-item" th:style="${layoutData.getCardItemStyle(component)}">
            <div th:replace="~{resumes/fragments/component-renderer ::
                                      component-renderer(${component}, ${globalStyle})}">
            </div>
        </div>
    </th:block>

    <!-- 空状态 -->
    <div th:if="${layoutData.isEmpty}" class="empty-state">
        <div class="empty-icon">📄</div>
        <div class="empty-title">暂无内容</div>
    </div>
</div>
</body>
</html>
