<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 组件渲染片段 - 修复样式表达式 -->
<div th:fragment="render(component, globalStyle, spacing)"
     class="component-wrapper">
    <!-- 在div内部设置style，避免复杂的表达式 -->
    <div th:if="${spacing != null or globalStyle != null}">
        <div th:style="|padding: ${spacing?.padding != null ? spacing.padding : '20px'};
                           margin-top: ${spacing?.sectionMargin != null ? spacing.sectionMargin : '20px'};
                           ${globalStyle?.primaryColor != null ? 'border-left: 4px solid ' + globalStyle.primaryColor + ';' : ''}
                           ${globalStyle?.secondaryColor != null ? 'background-color: ' + globalStyle.secondaryColor + '20;' : ''}|">

            <!-- 根据组件类型渲染 -->
            <div th:switch="${component.key}">

                <!-- 基本信息组件 -->
                <div th:case="'UserBasicInfo'">
                    <div th:with="props=${component.props != null ? component.props : (component.defaultConfig?.props != null ? component.defaultConfig.props : {})},
                                     styles=${component.styles != null ? component.styles : (component.defaultConfig?.styles != null ? component.defaultConfig.styles : {})}">

                        <div style="display: flex; gap: 20px; align-items: flex-start;">
                            <!-- 头像 -->
                            <div th:if="${props?.showAvatar == true and props?.avatar != null}">
                                <div style="flex-shrink: 0;">
                                    <img th:src="${props.avatar}"
                                         th:alt="${props.name != null ? props.name : '头像'}"
                                         th:style="|width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
                                                      border: ${styles.avatarBorder != null ? styles.avatarBorder : '2px solid #e8e8e8'}|">
                                </div>
                            </div>

                            <!-- 基本信息 -->
                            <div style="flex: 1;">
                                <!-- 姓名 -->
                                <div th:if="${props?.showName != false and props?.name != null}">
                                    <h1 class="component-title"
                                        th:style="|font-size: ${globalStyle?.fontSizes?.h1 != null ? globalStyle.fontSizes.h1 + 'px' : '24px'};
                                                     color: ${styles.titleColor != null ? styles.titleColor : '#333'}|"
                                        th:text="${props.name}">姓名</h1>
                                </div>

                                <!-- 职位 -->
                                <div th:if="${props?.title != null}">
                                    <p style="margin: 5px 0; color: #666; font-size: 16px;"
                                       th:text="${props.title}">职位</p>
                                </div>

                                <!-- 联系信息 -->
                                <div style="margin-top: 10px;">
                                    <div th:if="${props?.showPhone != false and props?.phone != null}">
                                        <div style="display: inline-block; margin-right: 15px; font-size: 14px; color: #555;">
                                            📱 <span th:text="${props.phone}">电话</span>
                                        </div>
                                    </div>

                                    <div th:if="${props?.showEmail != false and props?.email != null}">
                                        <div style="display: inline-block; margin-right: 15px; font-size: 14px; color: #555;">
                                            📧 <span th:text="${props.email}">邮箱</span>
                                        </div>
                                    </div>

                                    <div th:if="${props?.location != null}">
                                        <div style="display: inline-block; font-size: 14px; color: #555;">
                                            📍 <span th:text="${props.location}">地点</span>
                                        </div>
                                    </div>

                                    <div th:if="${props?.workYears != null}">
                                        <div style="display: inline-block; margin-left: 15px; font-size: 14px; color: #555;">
                                            ⏳ <span th:text="${props.workYears} + '年工作经验'"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 求职意向组件 -->
                <div th:case="'JobIntention'">
                    <div th:with="props=${component.props != null ? component.props : (component.defaultConfig?.props != null ? component.defaultConfig.props : {})},
                                     styles=${component.styles != null ? component.styles : (component.defaultConfig?.styles != null ? component.defaultConfig.styles : {})}">

                        <h2 class="component-title"
                            th:style="|color: ${styles.titleColor != null ? styles.titleColor : '#333'};
                                         padding-bottom: 10px;
                                         border-bottom: 2px solid ${globalStyle?.primaryColor != null ? globalStyle.primaryColor : '#1890ff'}|"
                            th:text="${component.defaultConfig?.props?.title != null ? component.defaultConfig.props.title : '求职意向'}">
                            求职意向
                        </h2>

                        <div th:if="${props?.intentions != null}">
                            <div th:each="intention : ${props.intentions}">
                                <div style="margin-top: 10px;">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <div>
                                            <strong th:text="${intention.position}" style="color: #333;">职位</strong>
                                            <div th:if="${intention.jobType != null}" style="margin-left: 10px;">
                                                    <span style="color: #666; font-size: 14px;"
                                                          th:text="${intention.jobType}">工作类型</span>
                                            </div>
                                        </div>

                                        <div th:if="${props?.showSalary != false and intention.salary != null}">
                                                <span th:style="|color: ${globalStyle?.accentColor != null ? globalStyle.accentColor : '#f5222d'}; font-weight: bold|"
                                                      th:text="'¥' + ${intention.salary}">薪资</span>
                                        </div>
                                    </div>

                                    <div th:if="${props?.showLocation != false and intention.city != null}">
                                        <div style="margin-top: 5px; color: #666; font-size: 14px;">
                                            📍 <span th:text="${intention.city}">城市</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 工作经历组件 -->
                <div th:case="'WorkExperience'">
                    <div th:with="props=${component.props != null ? component.props : (component.defaultConfig?.props != null ? component.defaultConfig.props : {})},
                                     styles=${component.styles != null ? component.styles : (component.defaultConfig?.styles != null ? component.defaultConfig.styles : {})}">

                        <h2 class="component-title"
                            th:style="|color: ${styles.titleColor != null ? styles.titleColor : '#333'};
                                         padding-bottom: 10px;
                                         border-bottom: 2px solid ${globalStyle?.primaryColor != null ? globalStyle.primaryColor : '#1890ff'}|"
                            th:text="${component.defaultConfig?.props?.title != null ? component.defaultConfig.props.title : '工作经历'}">
                            工作经历
                        </h2>

                        <div th:if="${props?.experiences != null}">
                            <div style="position: relative; padding-left: 20px; margin-top: 20px;">
                                <!-- 时间线 -->
                                <div th:style="|position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background-color: ${styles.timelineColor != null ? styles.timelineColor : '#e8e8e8'}|"></div>

                                <div th:each="exp : ${props.experiences}">
                                    <div style="position: relative; margin-bottom: 25px;">
                                        <!-- 时间点 -->
                                        <div th:style="|position: absolute; left: -25px; top: 5px; width: 12px; height: 12px;
                                                          background-color: ${globalStyle?.primaryColor != null ? globalStyle.primaryColor : '#1890ff'};
                                                          border-radius: 50%; border: 2px solid white; box-shadow: 0 0 0 2px ${globalStyle?.primaryColor != null ? globalStyle.primaryColor : '#1890ff'}20|"></div>

                                        <!-- 内容 -->
                                        <div>
                                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                                <div>
                                                    <div th:if="${props?.showCompany != false and exp.company != null}">
                                                        <h3 th:style="|margin: 0; color: ${styles.companyColor != null ? styles.companyColor : '#1890ff'}|"
                                                            th:text="${exp.company}">公司</h3>
                                                    </div>
                                                    <div th:if="${exp.position != null}">
                                                        <p style="margin: 5px 0; color: #333; font-weight: 500;"
                                                           th:text="${exp.position}">职位</p>
                                                    </div>
                                                </div>

                                                <!-- 时间 -->
                                                <div th:if="${props?.showDuration != false and exp.startDate != null}">
                                                    <div th:style="|color: ${styles.periodColor != null ? styles.periodColor : '#999'}; font-size: 14px|">
                                                        <span th:text="${#dates.format(exp.startDate, 'yyyy-MM')}">开始时间</span>
                                                        <span th:if="${exp.endDate != null}">
                                                                - <span th:text="${#dates.format(exp.endDate, 'yyyy-MM')}">结束时间</span>
                                                            </span>
                                                        <span th:if="${exp.isCurrent == true}"> - 至今</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- 工作描述 -->
                                            <div th:if="${exp.description != null}">
                                                <p style="margin: 10px 0; color: #555; line-height: 1.6;"
                                                   th:text="${exp.description}">工作描述</p>
                                            </div>

                                            <!-- 工作成果 -->
                                            <div th:if="${exp.achievements != null}">
                                                <ul style="margin: 10px 0 0 0; padding-left: 20px; color: #555;">
                                                    <li th:each="achievement : ${exp.achievements}"
                                                        th:text="${achievement}">成果</li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 教育背景组件 -->
                <div th:case="'EducationExperience'">
                    <div th:with="props=${component.props != null ? component.props : (component.defaultConfig?.props != null ? component.defaultConfig.props : {})},
                                     styles=${component.styles != null ? component.styles : (component.defaultConfig?.styles != null ? component.defaultConfig.styles : {})}">

                        <h2 class="component-title"
                            th:style="|color: ${styles.titleColor != null ? styles.titleColor : '#333'};
                                         padding-bottom: 10px;
                                         border-bottom: 2px solid ${globalStyle?.primaryColor != null ? globalStyle.primaryColor : '#1890ff'}|"
                            th:text="${component.defaultConfig?.props?.title != null ? component.defaultConfig.props.title : '教育背景'}">
                            教育背景
                        </h2>

                        <div th:if="${props?.experiences != null}">
                            <div th:each="edu : ${props.experiences}">
                                <div style="margin: 15px 0; padding: 15px; background: #f9f9f9; border-radius: 6px;">
                                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                        <div>
                                            <div th:if="${edu.university != null}">
                                                <h3 th:style="|margin: 0; color: ${styles.universityColor != null ? styles.universityColor : '#52c41a'}|"
                                                    th:text="${edu.university}">学校</h3>
                                            </div>

                                            <div style="margin-top: 5px;">
                                                <div th:if="${props?.showDegree != false and edu.degree != null}">
                                                        <span style="color: #333; font-weight: 500;"
                                                              th:text="${edu.degree}">学位</span>
                                                </div>

                                                <div th:if="${edu.major != null}" style="margin-left: 10px;">
                                                        <span th:style="|color: ${styles.majorColor != null ? styles.majorColor : '#666'}|"
                                                              th:text="${edu.major}">专业</span>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- 时间 -->
                                        <div th:if="${props?.showTime != false and edu.startDate != null}">
                                            <div style="color: #999; font-size: 14px;">
                                                <span th:text="${#dates.format(edu.startDate, 'yyyy-MM')}">开始时间</span>
                                                <span th:if="${edu.endDate != null}">
                                                        - <span th:text="${#dates.format(edu.endDate, 'yyyy-MM')}">结束时间</span>
                                                    </span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 描述 -->
                                    <div th:if="${edu.description != null}">
                                        <p style="margin: 10px 0 0 0; color: #666; line-height: 1.5; font-size: 14px;"
                                           th:text="${edu.description}">描述</p>
                                    </div>

                                    <!-- 成就 -->
                                    <div th:if="${edu.achievements != null}">
                                        <div style="margin-top: 10px;">
                                            <div style="font-size: 13px; color: #888;">主要成就:</div>
                                            <ul style="margin: 5px 0 0 0; padding-left: 15px; color: #666; font-size: 14px;">
                                                <li th:each="achievement : ${edu.achievements}"
                                                    th:text="${achievement}">成就</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 自我评价组件 -->
                <div th:case="'SelfEvaluation'">
                    <div th:with="props=${component.props != null ? component.props : (component.defaultConfig?.props != null ? component.defaultConfig.props : {})},
                                     styles=${component.styles != null ? component.styles : (component.defaultConfig?.styles != null ? component.defaultConfig.styles : {})}">

                        <h2 class="component-title"
                            th:style="|color: ${styles.titleColor != null ? styles.titleColor : '#333'};
                                         padding-bottom: 10px;
                                         border-bottom: 2px solid ${globalStyle?.primaryColor != null ? globalStyle.primaryColor : '#1890ff'}|"
                            th:text="${component.defaultConfig?.props?.title != null ? component.defaultConfig.props.title : '自我评价'}">
                            自我评价
                        </h2>

                        <div th:if="${props?.characterTraits != null}">
                            <div style="margin-top: 15px;">
                                <!-- 性格标签 -->
                                <div style="margin-bottom: 10px;">
                                        <span th:each="trait : ${props.characterTraits}"
                                              th:style="|display: inline-block; margin: 0 5px 5px 0; padding: 4px 10px;
                                                       background-color: ${styles.highlightBackground != null ? styles.highlightBackground : '#fff7e6'};
                                                       border-radius: 15px; font-size: 13px; color: #666|"
                                              th:text="${trait}">性格特点</span>
                                </div>

                                <!-- 技能总结 -->
                                <div th:if="${props?.skillsSummary != null}">
                                    <p th:style="|margin: 15px 0; color: ${styles.contentColor != null ? styles.contentColor : '#555'}; line-height: 1.8|"
                                       th:text="${props.skillsSummary}">技能总结</p>
                                </div>

                                <!-- 兴趣爱好 -->
                                <div th:if="${props?.hobbies != null}">
                                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0;">
                                        <div style="color: #888; font-size: 13px;">兴趣爱好:</div>
                                        <div style="color: #666; font-size: 14px;"
                                             th:text="${props.hobbies}">兴趣爱好</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 项目经历组件 -->
                <div th:case="'ProjectExperience'">
                    <div th:with="props=${component.props != null ? component.props : (component.defaultConfig?.props != null ? component.defaultConfig.props : {})},
                                     styles=${component.styles != null ? component.styles : (component.defaultConfig?.styles != null ? component.defaultConfig.styles : {})}">

                        <h2 class="component-title"
                            th:style="|color: ${styles.titleColor != null ? styles.titleColor : '#333'};
                                         padding-bottom: 10px;
                                         border-bottom: 2px solid ${globalStyle?.primaryColor != null ? globalStyle.primaryColor : '#1890ff'}|"
                            th:text="${component.defaultConfig?.props?.title != null ? component.defaultConfig.props.title : '项目经历'}">
                            项目经历
                        </h2>

                        <div style="color: #666; padding: 15px 0;">
                            <p>该项目经历组件需要特定的项目数据才能显示完整内容。</p>
                            <p style="margin-top: 5px; font-size: 13px; color: #999;">
                                    <span th:if="${component.props != null}">
                                        该组件包含 <strong th:text="${component.props.size()}">N</strong> 个配置项
                                    </span>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- 默认组件 -->
                <div th:case="*">
                    <div style="padding: 15px;">
                        <h3 style="margin: 0 0 10px 0; color: #333;">
                            <span th:text="${component.name}"></span>
                            <span th:if="${component.key != null}"> (<span th:text="${component.key}"></span>)</span>
                        </h3>

                        <div th:if="${component.props != null}">
                            <div style="margin-top: 10px;">
                                <div style="color: #666; font-size: 14px;">配置参数:</div>
                                <pre style="background: #f5f5f5; padding: 10px; border-radius: 4px; margin-top: 5px;
                                              font-size: 12px; overflow-x: auto; max-height: 200px;"
                                     th:text="${#strings.toString(component.props)}">组件配置</pre>
                            </div>
                        </div>

                        <div th:if="${component.defaultConfig != null}">
                            <div style="margin-top: 15px;">
                                <div style="color: #666; font-size: 14px;">默认配置:</div>
                                <div style="font-size: 13px; color: #888; margin-top: 3px;">
                                        <span th:if="${component.defaultConfig.props != null}">
                                            <span th:text="${component.defaultConfig.props.size()}">N</span> 个属性
                                        </span>
                                    <span th:if="${component.defaultConfig.styles != null}" style="margin-left: 10px;">
                                            <span th:text="${component.defaultConfig.styles.size()}">N</span> 个样式
                                        </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 如果样式数据都为空，使用默认样式 -->
    <div th:unless="${spacing != null or globalStyle != null}">
        <div style="padding: 20px; margin-top: 20px; border-left: 4px solid #1890ff; background-color: #f9f9f920;">
            <!-- 组件内容（同上） -->
            <div th:switch="${component.key}">
                <!-- 此处复制上述所有组件case内容，但要移除内联样式中的th:style -->
                <!-- 为了简洁，这里只展示一个示例 -->
                <div th:case="'UserBasicInfo'">
                    <!-- 使用纯CSS样式 -->
                    <div style="display: flex; gap: 20px; align-items: flex-start;">
                        <!-- 基本信息 -->
                        <div style="flex: 1;">
                            <h1 style="font-size: 24px; color: #333; margin: 0;">默认标题</h1>
                            <p style="margin: 5px 0; color: #666; font-size: 16px;">默认职位</p>
                            <div style="margin-top: 10px; color: #555; font-size: 14px;">
                                📱 电话: 13800138000
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 其他组件类型... -->
            </div>
        </div>
    </div>
</div>
</body>
</html>
